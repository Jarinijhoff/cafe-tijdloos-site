# Zet de site na elke push naar main op GitHub Pages.
# Dat is je eigen werkversie om aanpassingen te bekijken; de klant-URL
# (cafe-tijdloos-preview.pages.dev) verandert hier niet van.
#
# Eenmalig instellen op GitHub: Settings > Pages > Source: "GitHub Actions".
name: Werkversie op GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nooit twee publicaties tegelijk; de laatste push wint.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url }}
    steps:
      - id: publicatie
        uses: actions/deploy-pages@v4
