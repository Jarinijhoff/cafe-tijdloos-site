# Deployt automatisch naar Cloudflare Pages bij elke push naar main.
# Vereist één GitHub-secret: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit).
name: Deploy naar Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e2af251bab14da83bf44d279539dbb17
          command: pages deploy --branch main
