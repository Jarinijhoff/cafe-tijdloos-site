# Deployt naar Cloudflare Pages: https://cafe-tijdloos-preview.pages.dev
#
# LET OP: dit is de site die de klant ziet.
# Deze workflow start daarom NIET vanzelf bij een push. Je start hem zelf,
# via het tabblad Actions op GitHub ("Run workflow"), of lokaal met
# `npm run deploy`. Wil je toch automatisch deployen bij elke push naar main,
# zet dan de twee regels onder `push:` hieronder terug.
#
# Vereist één GitHub-secret: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit).
name: Deploy naar Cloudflare Pages (handmatig)

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e2af251bab14da83bf44d279539dbb17
          command: pages deploy --branch main
